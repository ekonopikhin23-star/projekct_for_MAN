<!DOCTYPE html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Адмін-панель | Квіз і карта</title>
<style>:root{--bg:#0d1b28;--card:#152838;--ink:#e6eef3;--mute:#8ea4b5;--line:#2a4256;--acc:#6f8cff;--ok:#3fc08a;--bad:#ff7088}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif;min-height:100vh}.wrap{max-width:900px;margin:0 auto;padding:24px 16px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px}h1{margin:0;font-size:28px}.pack-card{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:start;padding:12px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px}.pack-icon{font-size:32px}.pack-info h3{margin:0 0 4px;font-size:16px}.pack-meta{font-size:13px;color:var(--mute);display:flex;gap:12px;flex-wrap:wrap}.pack-actions{display:flex;gap:8px;flex-wrap:wrap}.btn{padding:8px 16px;border-radius:8px;border:0;font-weight:600;cursor:pointer}.btn-approve{background:var(--ok);color:#fff}.btn-reject{background:var(--bad);color:#fff}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:24px}.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;text-align:center}.stat-value{font-size:32px;font-weight:700}.stat-label{color:var(--mute);font-size:13px;margin-top:4px}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px;z-index:100}.modal-content{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px;max-width:500px;width:100%;max-height:80vh;overflow:auto}textarea{width:100%;min-height:100px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}.row{display:flex;gap:12px;margin-top:16px;justify-content:flex-end}[hidden]{display:none!important}</style></head><body>
<div class="wrap"><header><h1>🛡 Адмін-панель</h1><div style="display:flex;gap:8px"><button class="btn" id="btn-refresh" style="background:var(--acc);color:#fff">↻ Оновити</button><a href="index.html" class="btn" style="background:var(--line);color:var(--ink);text-decoration:none">← На сайт</a></div></header>
<div class="stats" id="stats"><div class="stat"><div class="stat-value" id="stat-total">—</div><div class="stat-label">Всього пакетів</div></div><div class="stat"><div class="stat-value" id="stat-pending">—</div><div class="stat-label">На модерації</div></div><div class="stat"><div class="stat-value" id="stat-approved">—</div><div class="stat-label">Схвалено</div></div><div class="stat"><div class="stat-value" id="stat-users">—</div><div class="stat-label">Користувачів</div></div></div>
<h2 style="margin-bottom:12px">Пакеты на модерації</h2><div id="pending-list">Завантаження…</div></div>
<div class="modal" id="reject-modal" hidden><div class="modal-content"><h2>❌ Відхилити пакет</h2><p id="reject-pack-title"></p><label>Причина відхилення (обов'язково):<br><textarea id="reject-reason" placeholder="Наприклад: не відповідає формату, дублікат, неприйнятний контент…"></textarea></label><div class="row"><button class="btn" id="confirm-reject" style="background:var(--bad)">Підтвердити відхилення</button><button class="btn" id="cancel-reject" style="background:var(--line);color:var(--ink)">Скасувати</button></div></div></div>
<script type="module">import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const SUPABASE_URL='https://ВАШ_PROJECT_REF.supabase.co',SUPABASE_ANON_KEY='ВАШ_ANON_KEY';const supabase=createClient(SUPABASE_URL,SUPABASE_ANON_KEY);let rejectPackId=null;async function init(){const{data:{user}}=await supabase.auth.getUser();if(!user){alert('Авторизуйтесь');location.href='index.html';return}const{data:profile}=await supabase.from('profiles').select('role').eq('id',user.id).maybeSingle();if(!profile||!['moderator','admin'].includes(profile.role)){alert('Недостатньо прав');location.href='index.html';return}await loadStats();await loadPending();document.getElementById('btn-refresh').onclick=()=>{loadStats();loadPending();};document.getElementById('confirm-reject').onclick=confirmReject;document.getElementById('cancel-reject').onclick=()=>document.getElementById('reject-modal').hidden=true;}async function loadStats(){const[{count:total},{count:pending},{count:approved},{count:users}]=await Promise.all([supabase.from('packs').select('*',{count:'exact',head:true}),supabase.from('packs').select('*',{count:'exact',head:true}).eq('status','pending'),supabase.from('packs').select('*',{count:'exact',head:true}).eq('status','approved'),supabase.from('profiles').select('*',{count:'exact',head:true})]);document.getElementById('stat-total').textContent=total||0;document.getElementById('stat-pending').textContent=pending||0;document.getElementById('stat-approved').textContent=approved||0;document.getElementById('stat-users').textContent=users||0;}async function loadPending(){const{data,error}=await supabase.from('packs').select(`*,profiles:author_id(username,github_login,avatar_url)`).eq('status','pending').order('created_at',{ascending:true});if(error)return;const list=document.getElementById('pending-list');if(!data.length){list.innerHTML='<p class="sub" style="color:var(--mute);padding:24px;text-align:center">Черга модерації порожня 🎉</p>';return}list.innerHTML=data.map(p=>`<div class="pack-card"><div class="pack-icon">${escapeHtml(p.icon||'📦')}</div><div class="pack-info"><h3>${escapeHtml(p.title)}</h3><div class="pack-meta"><span>${p.kind==='map'?'🗺 Карта':'🧩 Квіз'}</span><span>${p.question_count} пит.</span><span>${p.profiles?.github_login?'@'+p.profiles.github_login:(p.profiles?.username||'Анонім')}</span><span>${new Date(p.created_at).toLocaleString('uk-UA')}</span></div><p style="margin:8px 0 0;color:var(--mute);font-size:14px">${escapeHtml(p.description||'Без опису')}</p><details style="margin-top:8px"><summary style="cursor:pointer;color:var(--acc)">Переглянути JSON</summary><pre style="background:var(--bg);padding:8px;border-radius:8px;overflow:auto;font-size:11px;max-height:200px">${escapeHtml(JSON.stringify(p.data,null,2))}</pre></details></div><div class="pack-actions"><button class="btn btn-approve" data-approve="${p.id}">✅ Схвалити</button><button class="btn btn-reject" data-reject="${p.id}">❌ Відхилити</button></div></div>`).join('');list.querySelectorAll('[data-approve]').forEach(btn=>btn.onclick=()=>approvePack(btn.dataset.approve));list.querySelectorAll('[data-reject]').forEach(btn=>btn.onclick=()=>showRejectModal(btn.dataset.reject));}async function approvePack(id){if(!confirm('Схвалити цей пакет?'))return;const{error}=await supabase.from('packs').update({status:'approved'}).eq('id',id);if(error)alert('Помилка: '+error.message);else{await loadStats();await loadPending();}}function showRejectModal(id){rejectPackId=id;const pack=document.querySelector(`[data-reject="${id}"]`).closest('.pack-card');document.getElementById('reject-pack-title').textContent=pack.querySelector('h3').textContent;document.getElementById('reject-reason').value='';document.getElementById('reject-modal').hidden=false;}async function confirmReject(){const reason=document.getElementById('reject-reason').value.trim();if(!reason){alert('Вкажіть причину');return}const{error}=await supabase.from('packs').update({status:'rejected',rejection_reason:reason}).eq('id',rejectPackId);if(error)alert('Помилка: '+error.message);else{document.getElementById('reject-modal').hidden=true;await loadStats();await loadPending();}}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}init();</script></body></html>
